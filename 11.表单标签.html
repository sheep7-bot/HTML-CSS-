<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>表单标签案例</title>
    <style>
        /* 全局基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "SimSun", "宋体", serif;
        }
        .form-container {
            width: 500px;
            margin: 50px auto;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        h3 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .form-item {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        label {
            width: 100px;
            text-align: right;
            padding-right: 10px;
        }
        /* 输入框、下拉框通用样式 */
        input[type="text"],
        input[type="password"],
        select,
        textarea {
            flex: 1;
            padding: 8px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font-size: 14px;
        }
        /* 单选、复选框单独样式 */
        .radio-group,
        .checkbox-group {
            display: flex;
            gap: 20px;
        }
        /* 按钮样式 */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        button {
            padding: 8px 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .submit-btn {
            background-color: #007bff;
            color: #fff;
        }
        .reset-btn {
            background-color: #6c757d;
            color: #fff;
        }
    </style>
</head>
<body>
    <!-- 表单标签：所有表单元素都要包裹在 <form> 里 -->
    <form class="form-container" action="#" method="get">
        <h3>用户注册表单</h3>

        <!-- 1. 单行文本输入框 text -->
        <div class="form-item">
            <label for="username">用户名：</label>
            <input type="text" id="username" name="username" placeholder="请输入用户名" required>
        </div>

        <!-- 2. 密码输入框 password -->
        <div class="form-item">
            <label for="pwd">密码：</label>
            <input type="password" id="pwd" name="password" placeholder="请输入密码" required>
        </div>

        <!-- 3. 下拉选择框 select -->
        <div class="form-item">
            <label for="city">所在城市：</label>
            <select id="city" name="city">
                <option value="">请选择城市</option>
                <option value="beijing">北京</option>
                <option value="shanghai">上海</option>
                <option value="kunming">昆明</option>
            </select>
        </div>

        <!-- 4. 单选按钮 radio -->
        <div class="form-item">
            <label>性别：</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="male" checked> 男</label>
                <label><input type="radio" name="gender" value="female"> 女</label>
            </div>
        </div>

        <!-- 5. 复选框 checkbox -->
        <div class="form-item">
            <label>兴趣爱好：</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="hobby" value="read"> 阅读</label>
                <label><input type="checkbox" name="hobby" value="game"> 游戏</label>
                <label><input type="checkbox" name="hobby" value="sport"> 运动</label>
            </div>
        </div>

        <!-- 6. 多行文本域 textarea -->
        <div class="form-item">
            <label for="intro">个人简介：</label>
            <textarea id="intro" name="intro" rows="3" placeholder="请输入个人简介"></textarea>
        </div>

        <!-- 7. 提交按钮 submit 和重置按钮 reset -->
        <div class="btn-group">
            <button type="submit" class="submit-btn">提交</button>
            <button type="reset" class="reset-btn">重置</button>
        </div>
    </form>
</body>
</html>
